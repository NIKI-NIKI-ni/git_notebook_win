<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Чат</title>
    <link rel="stylesheet" href="chat.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css">
</head>
<body>
    <div class="container">
        <div class="sidebar">
            <div class="top_sidebar">
                <img class="connect_img" src="./img/Vector.svg" alt="Vector">
                <img src="./img/avatar.png" alt="avatar" style="width: 40px; height: 40px; border-radius: 50%;">
            </div>
            <div class="mid_sidebar">
                <img class="sidebar_icons" src="./img/planet.svg" alt="planet">
                <img class="massage_icon" src="./img/messages.svg" alt="messages">
                <img class="sidebar_icons" src="./img/camera.svg" alt="camera">
                <img class="sidebar_icons" src="./img/music.svg" alt="music">
                <img class="sidebar_icons" src="./img/calendar.svg" alt="calendar">
            </div>    
            <div class="bottom_sidebar">
                <img class="sidebar_icons" src="./img/settings.svg" alt="settings">
                <img class="sidebar_icons" src="./img/exit.svg" alt="exit">
            </div>
        </div> 
        <div class="chat">
            <div class="title">Messages</div>
            <div class="search-sort-container">
                <div class="search">
                    <img class="search_img" src="./img/search.svg">
                    <input type="text" id="searchInput" placeholder="Search">
                </div>
                <div class="sort-options">
                    <div class="sortby">Sort by</div>
                    <select id="sortSelect">
                        <option value="newest">Newest</option>
                        <option value="oldest">Oldest</option>
                        <option value="frequent">Most frequent</option>
                    </select>
                </div>
            </div>
            <div class="chat-messages" id="chatMessages">
                <!-- Сообщения будут добавляться здесь динамически -->
            </div>
        </div>
        <div class="dialog-box">
            <div class="dialog-box-header">
                <div class="dialog-box-header-info">
                    <img class="avatar" src="./img/avatar5.jpg" alt="avatar">
                    <div class="dialog-box-header-info-text">
                        <div class="dialog-box-header-info-text-name">John Doe</div>
                        <div class="dialog-box-header-info-text-status">Online</div>
                    </div>
                    <div class="dialog-box-header-actions">
                        <img src="./img/camera.svg" alt="camera">
                        <svg width="42" height="42" viewBox="0 0 42 42" fill="none" xmlns="http://www.w3.org/2000/svg">
                            <path d="M21 30C16.0293 30 12 25.9707 12 21C12 16.0293 16.0293 12 21 12C25.9707 12 30 16.0293 30 21C30 25.9707 25.9707 30 21 30ZM21 28.2C22.9096 28.2 24.7409 27.4414 26.0912 26.0912C27.4414 24.7409 28.2 22.9096 28.2 21C28.2 19.0904 27.4414 17.2591 26.0912 15.9088C24.7409 14.5586 22.9096 13.8 21 13.8C19.0904 13.8 17.2591 14.5586 15.9088 15.9088C14.5586 17.2591 13.8 19.0904 13.8 21C13.8 22.9096 14.5586 24.7409 15.9088 26.0912C17.2591 27.4414 19.0904 28.2 21 28.2ZM20.1 16.5H21.9V18.3H20.1V16.5ZM20.1 20.1H21.9V25.5H20.1V20.1Z" fill="black" fill-opacity="0.45"/>
                        </svg>
                    </div>
                </div>
            </div>
            <div class="dialog-box-messages" id="dialogMessages">
                <!-- Сообщения будут добавляться здесь динамически -->
            </div>
            <div class="dialog-box-input">
                <div class="input-container">
                    <input type="text" id="messageInput" placeholder="Type a message...">
                    <button id="sendMessage">
                        <i class="fas fa-paper-plane"></i>
                    </button>
                </div>
            </div>
        </div>
    </div>
    <script src="chat.js"></script>
    <script src="dialogs.js"></script>
</body>
</html>
